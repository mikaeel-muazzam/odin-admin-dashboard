<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | TOP</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="grid-container">
        <div class="sidebar">
            <div class="branding"><img src="./assets/view-dashboard.svg" alt="Dashboard icon">Dashboard</div>
            <div class="navigation one">
                <ul>
                    <li><img src="./assets/home.svg" alt="Home icon">Home</li>
                    <li><img src="./assets/card-account-details.svg" alt="Profile icon">Profile</li>
                    <li><img src="./assets/message.svg" alt="Messages icon">Messages</li>
                    <li><img src="./assets/history.svg" alt="History icon">History</li>
                    <li><img src="./assets/note-multiple.svg" alt="Tasks icon">Tasks</li>
                    <li><img src="./assets/account-group.svg" alt="Communities icon">Communities</li>
                </ul>
            </div>
            <div class="navigation two">
                <ul>
                    <li><img src="./assets/cog.svg" alt="Settings icon">Settings</li>
                    <li><img src="./assets/source-fork.svg" alt="Support icon">Support</li>
                    <li><img src="./assets/shield-alert.svg" alt="Privacy icon">Privacy</li>
                </ul>
            </div>
        </div>
        <div class="header">
            <div class="searchbar">
                <img src="./assets/magnify.svg" alt="search">
                <input>
            </div>
            <div class="profile-buttons">
                <img src="./assets/bell-ring.svg" alt="notifications">
                <img src="./assets/pfp-sample.jpg" class="pfp" alt="pfp">
                <p>Morgan Oakley</p>
            </div>
            <div class="profile-info">
                <img class="pfp" src="./assets/pfp-sample.jpg" alt="pfp">
                <p>Hi there,</p>
                <p>Morgan Oakley (@morgan)</p>
            </div>
            <div class="action-buttons">
                <button>New</button><button>Upload</button><button>Share</button>
            </div>
        </div>
        <div class="main-content">
            <div class="projects"></div>
            <div class="announcements"></div>
            <div class="trending"></div>
        </div>
    </div>
</body>
</html>
